<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram AI Chat Control</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><header><div><small>INSTAGRAM</small><h1>AI Chat Control</h1></div><div id="status" class="pill">Checking…</div></header><section class="stats"><div><small>BOT</small><b id="bot">—</b></div><div><small>QUIET</small><b id="quiet">—</b></div><div><small>IG API</small><b id="ig">—</b></div><div><small>AI API</small><b id="ai">—</b></div></section><main><aside class="panel list"><h2>Conversations</h2><div id="list"></div></aside><section class="panel chat"><div class="chatHead"><div><small>CURRENT CHAT</small><h2 id="active">Select a chat</h2></div><label>AI <input id="toggle" type="checkbox" disabled></label></div><div id="messages" class="messages"><div class="empty">No conversation selected.</div></div><div class="composer"><textarea id="text" rows="2" placeholder="Manual reply…" disabled></textarea><button id="send" disabled>Send</button></div></section><aside class="panel controls"><h2>Controls</h2><p><span>Style</span><b id="tone">—</b></p><p><span>Flirt</span><b id="flirt">—</b></p><p><span>Emoji</span><b id="emoji">—</b></p><p><span>Mature</span><b id="mature">—</b></p><div class="note">Automatic replies pause from 2:00 AM to 7:00 AM (Asia/Kolkata).</div></aside></main></div><script src="/app.js"></script></body></html>
